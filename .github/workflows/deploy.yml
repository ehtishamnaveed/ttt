# Deploy static site (raw HTML in this repo). Managed by the Dynamicleo CMS.
# Set repository secrets first (Settings -> Secrets -> Actions):
#   FTP_SERVER
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_SERVER_DIR
name: Deploy static website
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FTP deploy (raw HTML -> domain)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html' }}
